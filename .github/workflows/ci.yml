name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be re-run by hand from the Actions tab. Useful when a run needs
  # repeating without a code change - including the case where GitHub simply
  # never created one for a pushed head.
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          for f in mac-setup.sh scripts/*.sh tools/*.sh; do
            bash -n "$f"
          done

      # SC2028 (echo does not expand escape sequences) is exactly the class of
      # bug that shipped here before this job existed.
      - name: shellcheck
        run: shellcheck --severity=warning mac-setup.sh scripts/*.sh tools/*.sh

  idempotency:
    name: second run is a no-op
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CLI surface
        run: |
          ./mac-setup.sh --help
          ./mac-setup.sh --list
          # An unknown step must be rejected, not silently ignored.
          if ./mac-setup.sh --only definitely-not-a-step; then
            echo "unknown step was accepted" >&2
            exit 1
          fi

      # The steps that do not need macOS must be no-ops on a second run. This
      # is the property that makes the script safe to run repeatedly.
      - name: Run twice, assert the second run changes nothing
        run: |
          export HOME="$(mktemp -d)"
          git config --global user.email ci@example.com || true
          git config --global user.name CI || true
          git config --global --unset user.email
          git config --global --unset user.name

          ./mac-setup.sh --only dirs --only git > /dev/null
          ./mac-setup.sh --only dirs --only git 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee second-run.log

          if grep -qE '^\s+===> (creating|setting)' second-run.log; then
            echo "second run performed work - steps are not idempotent" >&2
            exit 1
          fi
          echo "second run was clean"

      # A failing step must say which one it was and how to resume, rather
      # than dying silently under `set -e`.
      - name: A failed step reports itself
        run: |
          # The python step exits non-zero on a machine with no Homebrew,
          # which is exactly the failure we want to see reported.
          set +e
          ./mac-setup.sh --only python > out.log 2>&1
          rc=$?
          set -e
          sed 's/\x1b\[[0-9;]*m//g' out.log

          if [ "$rc" -eq 0 ]; then
            echo "expected the step to fail on a machine without brew" >&2
            exit 1
          fi
          if ! grep -q "step 'python' failed" out.log; then
            echo "failure did not name the step" >&2
            exit 1
          fi
          if ! grep -q -- "--only python" out.log; then
            echo "failure did not say how to resume" >&2
            exit 1
          fi
          echo "failed step reported itself correctly"

  brewfile:
    name: Brewfile tokens resolve
    # Needs a real Homebrew, so this job wants macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # `brew bundle` fails the entire file on one bad token, so a single typo
      # takes every other package with it. `cask "gitup"` was wrong here for a
      # long time (it is "gitup-app") because nothing checked.
      - name: Validate every cask and formula
        run: ./tools/validate-brewfile.sh

  converge:
    name: macOS defaults converge
    # Deliberately run against the real `defaults`, not a stub: the whole
    # question is whether a written value reads back identically, and only
    # macOS can answer that. The runner is ephemeral, so writing to it is fine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply, then assert a second run changes nothing
        run: |
          # Always show the first run's output. Without this, a failure in the
          # very first command leaves no diagnostic at all - which is how a
          # bash 3.2 incompatibility once showed up as a 40ms mystery.
          if ! ./mac-setup.sh --only macos-defaults > first.log 2>&1; then
            echo "--- first run failed ---" >&2
            sed 's/\x1b\[[0-9;]*m//g' first.log >&2
            exit 1
          fi
          sed 's/\x1b\[[0-9;]*m//g' first.log | tail -3

          ./mac-setup.sh --only macos-defaults 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee second.log

          if ! grep -q 'already match' second.log; then
            echo "a setting did not read back as written - the step never settles" >&2
            exit 1
          fi

      # The point of comparing live values: drift gets corrected.
      - name: Assert drift is detected and put back
        run: |
          defaults write com.apple.dock orientation -string bottom

          ./mac-setup.sh --only macos-defaults 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee third.log

          if ! grep -q '1 setting(s) changed' third.log; then
            echo "expected exactly one changed setting after drifting one" >&2
            exit 1
          fi

          got="$(defaults read com.apple.dock orientation)"
          if [ "$got" != "left" ]; then
            echo "drifted setting was not restored (orientation=$got)" >&2
            exit 1
          fi
          echo "drift detected and corrected"
